name: Bug Report
description: Bir hata bildirimi oluşturun.
labels: [bug]
body:
  - type: markdown
    attributes:
      value: |
        Lütfen yaşadığınız sorunu mümkün olduğunca net açıklayın.

  - type: textarea
    id: description
    attributes:
      label: Sorunun Açıklaması
      placeholder: "Ne bekliyordunuz, ne oldu?"
    validations:
      required: true

  - type: textarea
    id: steps
    attributes:
      label: Tekrarlama Adımları
      placeholder: |
        1. ...
        2. ...
        3. ...
    validations:
      required: true

  - type: textarea
    id: logs
    attributes:
      label: Hata Kayıtları (Varsa)
      render: bash
      placeholder: Console, API response veya log çıktıları

  - type: input
    id: version
    attributes:
      label: Versiyon / Commit Hash
      placeholder: "örn: v1.2.3 veya commit hash"
